<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UniFi Dashboard</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1c2230; --muted: #667085; --line: #e3e6ec;
    --ok: #157f3b; --ok-bg: #e3f6ea; --warn: #9a5b00; --warn-bg: #fff1d6;
    --err: #b42318; --err-bg: #fde4e1; --unk: #55607a; --unk-bg: #e8ebf1;
    --accent: #2b6cff; --down: #2b6cff; --up: #c2410c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c; --card: #1a1f2a; --text: #e8ebf2; --muted: #98a2b3; --line: #2a3140;
      --ok: #5fd38a; --ok-bg: #153524; --warn: #f2b04a; --warn-bg: #3a2b0e;
      --err: #ff8a7a; --err-bg: #3d1a16; --unk: #aab3c5; --unk-bg: #262d3b;
      --accent: #6f9bff; --down: #6f9bff; --up: #f08a5d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); font-size: 12px; }
  .actions { display: flex; gap: 8px; align-items: center; }
  button { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .6; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .grid3 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); margin-bottom: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
  .card h2 { margin: 0 0 10px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .big { font-size: 26px; font-weight: 650; line-height: 1.2; }
  .note { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .chip.ok { color: var(--ok); background: var(--ok-bg); }
  .chip.warning { color: var(--warn); background: var(--warn-bg); }
  .chip.error { color: var(--err); background: var(--err-bg); }
  .chip.unknown { color: var(--unk); background: var(--unk-bg); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .wl { display: flex; align-items: center; gap: 6px; min-height: 28px; white-space: nowrap; }
  .wl.r { justify-content: flex-end; }
  th { font-size: 12px; font-weight: 600; color: var(--muted); }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .tablewrap { overflow-x: auto; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend .d { color: var(--down); } .legend .u { color: var(--up); }
  .spark { width: 100%; height: 48px; display: block; margin-top: 8px; }
  .spark .d { stroke: var(--down); } .spark .u { stroke: var(--up); }
  .banner { border: 1px solid var(--err); background: var(--err-bg); color: var(--err); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; }
  .banner.warn { border-color: var(--warn); background: var(--warn-bg); color: var(--warn); }
  .empty { text-align: center; padding: 48px 16px; color: var(--muted); }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); padding: 20px; width: min(460px, 92vw); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 13px; }
  input { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .dlg-actions { display: flex; gap: 8px; justify-content: space-between; margin-top: 18px; }
  .dlg-actions div { display: flex; gap: 8px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>UniFi Dashboard</h1>
      <div class="sub" id="updated">Not connected</div>
    </div>
    <div class="actions">
      <button id="refresh" type="button">Refresh</button>
      <button id="settings" type="button">Settings</button>
    </div>
  </header>
  <div id="banner"></div>
  <main id="main"></main>
</div>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 style="margin:0 0 4px;font-size:18px">Connection</h2>
    <div class="hint">Stored only in this browser's localStorage, under keys prefixed <code>unifi-dashboard:</code>.</div>
    <label for="apiKey">Site Manager API key</label>
    <input id="apiKey" type="password" placeholder="Paste your API key" autocomplete="off">
    <div class="hint">Create one at unifi.ui.com in the API section. The page shows every site that key can see.</div>
    <label for="refreshSec">Refresh every (seconds)</label>
    <input id="refreshSec" type="number" min="15" step="5" value="60">
    <details>
      <summary>Advanced</summary>
      <label for="apiBase">API base URL</label>
      <input id="apiBase" type="url" placeholder="https://api.ui.com" autocomplete="off">
      <div class="hint">Change only if you route requests through your own CORS proxy.</div>
    </details>
    <div class="dlg-actions">
      <button type="button" id="clearKey">Clear saved settings</button>
      <div>
        <button type="button" id="cancel">Cancel</button>
        <button type="submit" class="primary" value="save">Save</button>
      </div>
    </div>
  </form>
</dialog>

<script>
"use strict";

// ---------- storage (all keys namespaced) ----------
const NS = "unifi-dashboard";
const DEFAULT_BASE = "https://api.ui.com";
const store = {
  get(k, d = "") { try { const v = localStorage.getItem(`${NS}:${k}`); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(`${NS}:${k}`, v); } catch {} },
  del(k) { try { localStorage.removeItem(`${NS}:${k}`); } catch {} },
};
const cfg = {
  load() {
    this.apiKey = store.get("apiKey");
    this.apiBase = store.get("apiBase") || DEFAULT_BASE;
    this.refreshSec = Math.max(15, parseInt(store.get("refreshSec", "60"), 10) || 60);
  },
};
cfg.load();
const DEMO = new URLSearchParams(location.search).has("demo");

// ---------- helpers ----------
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (v) => (Number.isFinite(+v) ? +v : 0);
const has = (v) => v !== null && v !== undefined && Number.isFinite(+v);
function fmtRate(bytesPerSec) {
  const u = ["bps", "kbps", "Mbps", "Gbps"]; let i = 0; let n = num(bytesPerSec) * 8;
  while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  return `${i === 0 || n >= 100 ? n.toFixed(0) : n.toFixed(1)} ${u[i]}`;
}
const RANK = { ok: 0, warning: 1, error: 2 };
const LABEL = { ok: "Healthy", warning: "Degraded", error: "Down", unknown: "Unknown" };
const chip = (st, text) => `<span class="chip ${esc(st)}"><i></i>${esc(text ?? LABEL[st] ?? st)}</span>`;
function worst(statuses) {
  const known = statuses.filter((s) => s in RANK);
  if (!known.length) return "unknown";
  return known.reduce((a, b) => (RANK[b] > RANK[a] ? b : a));
}
const settle = (p) => p.then((value) => ({ ok: true, value }), (error) => ({ ok: false, error }));

// ---------- API ----------
async function api(path, init = {}) {
  const base = cfg.apiBase.replace(/\/+$/, "");
  const headers = { "X-API-Key": cfg.apiKey, Accept: "application/json", ...(init.body ? { "Content-Type": "application/json" } : {}) };
  const res = await fetch(base + path, { ...init, headers, signal: AbortSignal.timeout(30000) });
  if (!res.ok) {
    const e = new Error(`${res.status} ${res.statusText} (${path.split("?")[0]})`);
    e.status = res.status; e.retryAfter = res.headers.get("retry-after");
    throw e;
  }
  return res.json();
}

async function pages(path) {
  const out = []; let token = "";
  for (let i = 0; i < 20; i++) {
    const r = await api(path + (token ? `&nextToken=${encodeURIComponent(token)}` : ""));
    out.push(...(r.data || []));
    token = r.nextToken;
    if (!token) break;
  }
  return out;
}

// Memoised (promise-level) cache so repeated refreshes don't hammer the console connector.
const cache = new Map();
const CONNECTOR_TTL = 5 * 60 * 1000;
function cached(key, fn) {
  const hit = cache.get(key);
  if (hit && Date.now() - hit.t < CONNECTOR_TTL) return hit.p;
  const p = settle(fn());
  cache.set(key, { t: Date.now(), p });
  return p;
}

// Multi-WAN: the gateway device reports one object per WAN (wan1, wan2, ...).
function parseWans(devices) {
  const isWan = (k) => /^wan\d+$/.test(k);
  const gw = devices.find((d) => Object.keys(d).some(isWan));
  if (!gw) return [];
  return Object.keys(gw).filter(isWan).sort((a, b) => parseInt(a.slice(3), 10) - parseInt(b.slice(3), 10))
    .map((k) => {
      const w = gw[k] || {};
      return {
        name: w.name || w.ifname || k.toUpperCase(), ip: w.ip || "", enabled: w.enable !== false,
        up: w.up === undefined ? undefined : !!w.up,
        down: has(w["rx_bytes-r"]) ? +w["rx_bytes-r"] : undefined,
        upRate: has(w["tx_bytes-r"]) ? +w["tx_bytes-r"] : undefined,
      };
    })
    .filter((w) => w.enabled);
}

// Per-WAN detail is not in the Site Manager cloud API. Best effort: read the gateway from the
// console's local Network API through the cloud connector (assumes one site per console).
function loadWans(site) {
  return cached(`dev:${site.hostId}`, () =>
    api(`/v1/connector/consoles/${encodeURIComponent(site.hostId)}/network/api/s/default/stat/device`).then((r) => parseWans(r.data || [])));
}

// ---------- health rules (derived from cloud statistics) ----------
function siteHealth(st) {
  const c = st.counts || {};
  if (num(c.offlineGatewayDevice) > 0) return "error";
  if (num(c.offlineDevice) > 0 || num(c.criticalNotification) > 0 || (st.internetIssues || []).length) return "warning";
  return "ok";
}
function wanHealth(st, w) {
  const c = st.counts || {};
  if (num(c.offlineGatewayDevice) > 0) return "error";
  if (!num(c.gatewayDevice) && !w) return "unknown";
  if (w && has(w.uptime) && num(w.uptime) === 0 && num(w.downtime) > 0) return "error";
  if ((st.internetIssues || []).length || (w && (num(w.downtime) > 0 || num(w.packetLoss) >= 2))) return "warning";
  return "ok";
}
// Fold per-WAN link state (from the gateway) into the site's WAN status.
function combineWan(base, wans) {
  if (!wans?.ok) return base;
  const states = wans.value.filter((w) => w.up !== undefined).map((w) => w.up);
  if (!states.length) return base;
  const derived = states.every((u) => !u) ? "error" : states.some((u) => !u) ? "warning" : "ok";
  return worst([base, derived]);
}
function hostName(h) {
  const r = h.reportedState || {};
  return r.name || r.hostname || h.userData?.name || h.ipAddress || h.id;
}
const KBPS_TO_BYTES = 125; // kbit/s -> bytes/s

async function loadModels() {
  const [sites, hosts, isp] = await Promise.all([
    pages("/v1/sites?pageSize=100"),
    settle(pages("/v1/hosts?pageSize=100")),
    settle(api("/v1/isp-metrics/5m?duration=24h")),
  ]);
  const warnings = [];
  if (!isp.ok) warnings.push(`WAN metrics unavailable: ${explain(isp.error)}`);
  const hostById = new Map((hosts.ok ? hosts.value : []).map((h) => [h.id, hostName(h)]));

  // ISP metrics: latest sample per site, and a 24 h total-traffic series.
  const latest = new Map(); const totals = new Map();
  for (const entry of isp.ok ? isp.value.data || [] : []) {
    const periods = [...(entry.periods || [])].sort((a, b) => String(a.metricTime).localeCompare(String(b.metricTime)));
    for (const p of periods) {
      const w = p.data?.wan; if (!w) continue;
      latest.set(`${entry.hostId}:${entry.siteId}`, w);
      const t = totals.get(p.metricTime) || { down: 0, up: 0 };
      t.down += num(w.download_kbps) * KBPS_TO_BYTES; t.up += num(w.upload_kbps) * KBPS_TO_BYTES;
      totals.set(p.metricTime, t);
    }
  }
  const series = [...totals].sort((a, b) => String(a[0]).localeCompare(String(b[0]))).map(([t, v]) => ({ t, ...v }));

  const models = await Promise.all(sites.map(async (s) => {
    const st = s.statistics || {};
    const w = latest.get(`${s.hostId}:${s.siteId}`);
    const wans = await loadWans(s);
    return {
      id: s.siteId, name: s.meta?.name || s.siteId, host: hostById.get(s.hostId) || "",
      isp: st.ispInfo?.name || "", counts: st.counts || {}, issues: st.internetIssues || [],
      wanUptime: st.percentages?.wanUptime, wan: w,
      health: siteHealth(st), wanStatus: combineWan(wanHealth(st, w), wans),
      down: w ? num(w.download_kbps) * KBPS_TO_BYTES : 0, up: w ? num(w.upload_kbps) * KBPS_TO_BYTES : 0,
      wans,
    };
  }));
  return { models, series, warnings };
}

// ---------- demo data ----------
function demoModels() {
  const j = (n) => Math.round(n * (0.8 + Math.random() * 0.4));
  const models = [
    { id: "a", name: "Home", host: "Dream Machine Pro", isp: "Example Fiber", counts: { totalDevice: 9, offlineDevice: 0, wifiClient: 31, wiredClient: 12, criticalNotification: 0 },
      issues: [], wanUptime: 100, wan: { avgLatency: j(9), packetLoss: 0 }, health: "ok", wanStatus: "ok", down: j(7e6), up: j(9e5),
      wans: { ok: true, value: [
        { name: "Fiber", ip: "203.0.113.7", up: true, down: j(6e6), upRate: j(8e5) },
        { name: "LTE backup", ip: "198.51.100.4", up: true, down: j(1e5), upRate: j(2e4) }] } },
    { id: "b", name: "Cabin", host: "Cloud Gateway Max", isp: "Example Cable", counts: { totalDevice: 4, offlineDevice: 1, wifiClient: 5, wiredClient: 1, criticalNotification: 1 },
      issues: [{}], wanUptime: 97.4, wan: { avgLatency: j(48), packetLoss: 3.1, downtime: 120, uptime: 3480 }, health: "warning", wanStatus: "warning", down: j(1e6), up: j(2e5),
      wans: { ok: false, error: new Error("403 Forbidden (/v1/connector/consoles/…)") } },
  ];
  const series = Array.from({ length: 288 }, (_, i) => ({ t: i, down: 5e6 + 4e6 * Math.sin(i / 20) + Math.random() * 1e6, up: 1e6 + 5e5 * Math.sin(i / 15) + Math.random() * 2e5 }));
  return Promise.resolve({ models, series, warnings: [] });
}

// ---------- state & rendering ----------
const state = { models: [], series: [], warnings: [], updated: null, error: "", busy: false };

function spark(series) {
  const n = series[0].length; if (n < 2) return "";
  const w = 240, h = 48, max = Math.max(1, ...series.flat());
  const line = (vals, cls) => `<polyline class="${cls}" fill="none" stroke-width="2" vector-effect="non-scaling-stroke" points="${
    vals.map((v, i) => `${((i / (n - 1)) * w).toFixed(1)},${(h - 2 - (v / max) * (h - 4)).toFixed(1)}`).join(" ")}"/>`;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Last 24 hours of WAN traffic">${line(series[0], "d")}${line(series[1], "u")}</svg>`;
}

// One entry per WAN. Falls back to a single site-level line from the cloud ISP metrics.
function wanLines(m) {
  const ws = m.wans?.ok && m.wans.value.length ? m.wans.value : null;
  if (!ws) return [{ name: "WAN", ip: "", status: m.wanStatus, down: m.down, up: m.up }];
  return ws.map((w) => ({ name: w.name, ip: w.ip, status: w.up === undefined ? "unknown" : w.up ? "ok" : "error", down: w.down, up: w.upRate }));
}

function render() {
  const main = $("#main");
  if (!DEMO && !cfg.apiKey) {
    main.innerHTML = `<div class="card empty"><p>Add your Site Manager API key to get started.</p><button class="primary" id="openSettings" type="button">Open settings</button></div>`;
    $("#openSettings").onclick = openSettings;
    return;
  }
  const M = state.models;
  if (!M.length) { main.innerHTML = `<div class="card empty">${state.busy ? "Loading…" : "No sites found for this API key."}</div>`; return; }
  const sum = (f) => M.reduce((a, m) => a + num(f(m)), 0);

  // overall health
  const overall = worst(M.map((m) => m.health));
  const okSites = M.filter((m) => m.health === "ok").length;
  const offline = sum((m) => m.counts.offlineDevice), total = sum((m) => m.counts.totalDevice);
  const critical = sum((m) => m.counts.criticalNotification), issues = sum((m) => m.issues.length);
  const countChip = (n, label, bad) => `<span class="chip ${n > 0 ? bad : "ok"}"><i></i>${n} ${label}</span>`;

  // WAN
  const wanStatus = worst(M.map((m) => m.wanStatus));
  const lat = M.map((m) => m.wan?.avgLatency).filter(has);
  const loss = M.map((m) => m.wan?.packetLoss).filter(has);
  const avg = (a) => a.reduce((x, y) => x + +y, 0) / a.length;

  // traffic
  const down = sum((m) => m.down), up = sum((m) => m.up);
  const s = state.series;
  const peakDown = s.length ? Math.max(...s.map((x) => x.down)) : 0;

  main.innerHTML = `
  <div class="grid3">
    <section class="card"><h2>Overall health</h2>
      <div class="big">${chip(overall)}</div>
      <div class="note">${okSites} of ${M.length} site${M.length === 1 ? "" : "s"} healthy</div>
      <div class="chips">${countChip(offline, `of ${total} devices offline`, "warning")}${countChip(critical, "critical alerts", "warning")}${countChip(issues, "internet issues", "warning")}</div>
    </section>
    <section class="card"><h2>WAN health</h2>
      <div class="big">${chip(wanStatus)}</div>
      <div class="note">${lat.length ? `Avg latency ${Math.round(avg(lat))} ms` : "No latency data"}${loss.length ? ` · avg packet loss ${avg(loss).toFixed(1)}%` : ""}</div>
    </section>
    <section class="card"><h2>Total traffic</h2>
      <div class="big">${esc(fmtRate(down))} <span class="sub">down</span></div>
      <div class="big" style="font-size:18px">${esc(fmtRate(up))} <span class="sub">up</span></div>
      ${spark([s.map((x) => x.down), s.map((x) => x.up)])}
      <div class="legend"><span class="d">● Download</span><span class="u">● Upload</span><span>Last 24 h${s.length ? ` · peak ${esc(fmtRate(peakDown))} down` : ""}</span></div>
    </section>
  </div>

  <section class="card" style="margin-bottom:12px"><h2>Sites</h2>
    <div class="tablewrap"><table>
      <thead><tr><th>Site</th><th>Health</th><th>WAN</th><th class="num">Down</th><th class="num">Up</th><th>ISP</th><th class="num">WAN uptime</th><th class="num">Latency</th><th class="num">Loss</th><th class="num">Devices</th><th class="num">Clients</th></tr></thead>
      <tbody>${M.map((m) => {
        const lines = wanLines(m);
        const isDefault = /^default$/i.test(m.name); // single-site consoles: show the console name instead
        const one = (html, r) => `<div class="wl${r ? " r" : ""}">${html}</div>`;
        return `<tr>
        <td>${one(esc(isDefault && m.host ? m.host : m.name))}${!isDefault && m.host ? `<div class="meta sub">${esc(m.host)}</div>` : ""}</td>
        <td>${one(chip(m.health))}</td>
        <td>${lines.map((l) => one(`${chip(l.status)}${/^wan$/i.test(l.name) ? "" : ` ${esc(l.name)}`}${l.ip ? ` <span class="sub">${esc(l.ip)}</span>` : ""}`)).join("")}</td>
        <td class="num">${lines.map((l) => one(has(l.down) ? esc(fmtRate(l.down)) : "–", true)).join("")}</td>
        <td class="num">${lines.map((l) => one(has(l.up) ? esc(fmtRate(l.up)) : "–", true)).join("")}</td>
        <td>${one(esc(m.isp || "–"))}</td>
        <td class="num">${one(has(m.wanUptime) ? `${(+m.wanUptime).toFixed(2)}%` : "–", true)}</td>
        <td class="num">${one(has(m.wan?.avgLatency) ? `${Math.round(m.wan.avgLatency)} ms` : "–", true)}</td>
        <td class="num">${one(has(m.wan?.packetLoss) ? `${(+m.wan.packetLoss).toFixed(1)}%` : "–", true)}</td>
        <td class="num">${one(`${num(m.counts.offlineDevice) ? `${num(m.counts.offlineDevice)} offline / ` : ""}${num(m.counts.totalDevice)}`, true)}</td>
        <td class="num">${one(String(num(m.counts.wifiClient) + num(m.counts.wiredClient)), true)}</td></tr>`;
      }).join("")}
      </tbody></table></div>
    <div class="note">Health is derived from offline devices, critical alerts and reported internet issues. Each WAN gets its own line when the gateway reports it through the console connector; otherwise one line shows the latest 5-minute ISP sample. Uptime, latency and loss are per site.</div>
  </section>`;
}

function explain(e) {
  if (e instanceof TypeError) {
    return "Couldn't reach the API. Check your connection. If it persists, the browser is probably blocking the request because the API doesn't send CORS headers for this page; a CORS proxy (set under Advanced in Settings) may be required.";
  }
  if (e.name === "TimeoutError") return "The request timed out.";
  if (e.status === 401 || e.status === 403) return `Authentication failed (${e.message}). Check the API key.`;
  if (e.status === 429) return `Rate limited (${e.message})${e.retryAfter ? `, retry in ${e.retryAfter}s` : ""}.`;
  return e.message;
}

async function refresh() {
  if (state.busy) return;
  if (!DEMO && !cfg.apiKey) { render(); return; }
  state.busy = true; $("#refresh").disabled = true;
  try {
    const r = await (DEMO ? demoModels() : loadModels());
    state.models = r.models; state.series = r.series; state.warnings = r.warnings;
    state.updated = new Date(); state.error = "";
  } catch (e) {
    state.error = explain(e);
  } finally {
    state.busy = false; $("#refresh").disabled = false;
    $("#banner").innerHTML = state.error ? `<div class="banner" role="alert">${esc(state.error)}</div>`
      : state.warnings.map((w) => `<div class="banner warn">${esc(w)}</div>`).join("");
    $("#updated").textContent = state.updated ? `${DEMO ? "Demo data · " : ""}Updated ${state.updated.toLocaleTimeString()}` : "Not connected";
    render();
  }
}

// ---------- settings dialog ----------
const dlg = $("#dlg");
function openSettings() {
  $("#apiKey").value = cfg.apiKey; $("#refreshSec").value = cfg.refreshSec;
  $("#apiBase").value = store.get("apiBase");
  dlg.showModal();
}
$("#settings").onclick = openSettings;
$("#cancel").onclick = () => dlg.close();
$("#clearKey").onclick = () => {
  ["apiKey", "apiBase", "refreshSec", "baseUrl"].forEach((k) => store.del(k));
  cfg.load(); state.models = []; state.series = []; state.warnings = []; state.error = ""; cache.clear();
  $("#banner").innerHTML = ""; dlg.close(); schedule(); render();
};
$("#form").addEventListener("submit", () => {
  store.set("apiKey", $("#apiKey").value.trim());
  const base = $("#apiBase").value.trim();
  if (base && base !== DEFAULT_BASE) store.set("apiBase", base); else store.del("apiBase");
  store.set("refreshSec", String(Math.max(15, parseInt($("#refreshSec").value, 10) || 60)));
  cfg.load(); cache.clear(); schedule(); refresh();
});
$("#refresh").onclick = refresh;

let timer;
function schedule() {
  clearInterval(timer);
  timer = setInterval(() => { if (!document.hidden) refresh(); }, cfg.refreshSec * 1000);
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && state.updated && Date.now() - state.updated > cfg.refreshSec * 1000) refresh();
});

schedule();
render();
refresh();
</script>
</body>
</html>
